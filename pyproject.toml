[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "CreMail"
version = "2.3.0"
authors = [
    {name = "QiuMing", email = "mocre_rx@foxmail.com"},
]
description = "A powerful and easy-to-use Python email sending module with support for multiple configuration methods, async sending, and verification code generation."
readme = "README.md"
license = "MIT"
keywords = ["email", "smtp", "send", "async", "verification", "code"]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# 同步发信完全零依赖（smtplib 为标准库）。
# aiosmtplib / jinja2 为可选依赖，见下方 [project.optional-dependencies]，按需安装。
dependencies = []

[project.optional-dependencies]
async = ["aiosmtplib>=3.0.0"]
template = ["jinja2>=3.0.0"]
all = ["aiosmtplib>=3.0.0", "jinja2>=3.0.0"]

[project.urls]
Homepage = "https://github.com/MoCre-QiuMing/CreMail"
Repository = "https://github.com/MoCre-QiuMing/CreMail"
"Bug Tracker" = "https://github.com/MoCre-QiuMing/CreMail/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["cremail*"]